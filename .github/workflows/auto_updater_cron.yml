name: Automated Lottery Results Updater

on:
  schedule:
    # Runs at 21:30 UTC (00:30 Israel Time) every day
    - cron: '30 21 * * *'
    # Runs at 09:30 UTC (12:30 Israel Time) every day as a safety check
    - cron: '30 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update_results:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Trigger Lottery Auto-Updater Endpoint
        run: |
          echo "Triggering /api/cron/update on LottoFire..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://lotto-bc9e0.web.app/api/cron/update?key=Xhknrhkhui")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "Auto-update succeeded!"
          else
            echo "Warning: Received non-200 status code"
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keepalive Activity (Every 45 Days)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_DIFF=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
          echo "Days since last commit: $DAYS_DIFF"
          
          if [ $DAYS_DIFF -ge 45 ]; then
            echo "45 days elapsed without commit activity. Creating automated keepalive push..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "Last keepalive: $(date -u)" > .github/keepalive.txt
            git add .github/keepalive.txt
            git commit -m "chore(ci): keepalive activity [skip ci]"
            git push origin main || git push -f origin HEAD:keepalive
          else
            echo "Repository has recent activity ($DAYS_DIFF days old < 45 days threshold). No keepalive push needed."
          fi
